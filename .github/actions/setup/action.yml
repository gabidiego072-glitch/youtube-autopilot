# Shared setup for the autopilot jobs: Python, FFmpeg, Blender and the Piper voice (cached).
# Works on GitHub-hosted runners and on a self-hosted Linux x64 runner (your own computer).
name: Autopilot setup
description: Install Python dependencies, FFmpeg, Blender and the voice model
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: FFmpeg and fonts
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null || ! fc-list | grep -qi inter; then
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter fonts-dejavu-core
        fi
    - name: Cache Blender and voice
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.tool_cache }}/blender
          models/voices
        key: tools-${{ runner.os }}-blender-4.5.15-piper-voices-v2
    - name: Install Blender and voice
      shell: bash
      run: |
        BLENDER_DIR="${{ runner.tool_cache }}/blender"
        if [ ! -x "$BLENDER_DIR/blender-4.5.15-linux-x64/blender" ]; then scripts/install_blender.sh "$BLENDER_DIR"; fi
        echo "BLENDER_BINARY=$BLENDER_DIR/blender-4.5.15-linux-x64/blender" >> "$GITHUB_ENV"
        # Narrator voices the system experiments with (all allow commercial use; see app/services/experiments.py).
        for v in es/es_ES/davefx/medium es/es_ES/sharvard/medium es/es_MX/claude/high es/es_MX/ald/medium es/es_AR/daniela/high; do
          name="$(echo "$v" | awk -F/ '{print $2"-"$3"-"$4}')"
          if [ ! -f "models/voices/${name}.onnx" ]; then scripts/install_voice.sh "$v"; fi
        done
        echo "PIPER_VOICE_MODEL=$PWD/models/voices/es_ES-davefx-medium.onnx" >> "$GITHUB_ENV"
    - name: Python dependencies
      shell: bash
      run: pip install -r requirements.txt
