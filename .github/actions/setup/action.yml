# Shared setup for the autopilot jobs: Python, FFmpeg, Blender and the Piper voices.
# Works on GitHub-hosted runners (tools restored from the Actions cache) and on a self-hosted Linux x64
# runner such as your own PC under WSL (tools stay installed in the runner's tool folder, no download).
name: Autopilot setup
description: Install Python dependencies, FFmpeg, Blender and the voice models
inputs:
  voice:
    description: default narrator model (used when the video's experiment voice is missing)
    default: es_ES-davefx-medium
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      if: runner.environment == 'github-hosted'
      with:
        python-version: "3.13"
    # On your own PC: the system Python (Ubuntu 24.04 has 3.12) in a virtualenv kept between runs.
    # GitHub's prebuilt Python needs a newer CPU (x86-64-v3/AVX2) than older laptops have.
    - name: Python on a self-hosted PC
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        VENV="$HOME/.autopilot-venv"
        if [ ! -x "$VENV/bin/python" ]; then python3 -m venv "$VENV"; fi
        echo "$VENV/bin" >> "$GITHUB_PATH"
    - name: FFmpeg and fonts
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null || ! fc-list | grep -qi inter; then
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter fonts-dejavu-core
        fi
    - name: Cache Blender and voices (GitHub-hosted only; a self-hosted PC keeps them on disk)
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.tool_cache }}/blender
          ${{ runner.tool_cache }}/voices
        key: tools-${{ runner.os }}-blender-4.5.15-piper-voices-v4
    - name: Install Blender and voices
      shell: bash
      run: |
        BLENDER_DIR="${{ runner.tool_cache }}/blender"
        VOICES="${{ runner.tool_cache }}/voices"
        if [ ! -x "$BLENDER_DIR/blender-4.5.15-linux-x64/blender" ]; then scripts/install_blender.sh "$BLENDER_DIR"; fi
        echo "BLENDER_BINARY=$BLENDER_DIR/blender-4.5.15-linux-x64/blender" >> "$GITHUB_ENV"
        # Narrator voices the system experiments with (all allow commercial use; see app/services/experiments.py).
        for v in es/es_ES/davefx/medium es/es_ES/sharvard/medium es/es_MX/claude/high es/es_MX/ald/medium es/es_AR/daniela/high \
                 en/en_US/norman/medium en/en_US/john/medium en/en_US/kristin/medium; do
          name="$(echo "$v" | awk -F/ '{print $2"-"$3"-"$4}')"
          if [ ! -f "$VOICES/${name}.onnx" ]; then scripts/install_voice.sh "$v" "$VOICES"; fi
        done
        echo "PIPER_VOICE_MODEL=$VOICES/${{ inputs.voice }}.onnx" >> "$GITHUB_ENV"
    - name: Python dependencies
      shell: bash
      run: python -m pip install -q -r requirements.txt
