# Daily autonomous production. Disabled until you set the repository variable AUTOPILOT_ENABLED=true
# and the secrets listed in docs/AUTOMATION.md. Runs can also be started by hand (Actions -> Autopilot).
name: Autopilot

on:
  schedule:
    - cron: "17 5 * * *"  # 05:17 UTC every day
  workflow_dispatch:
    inputs:
      command:
        description: "run | approve | resume | status"
        default: run
      run_id:
        description: "run id (approve/resume)"
        default: ""
      mode:
        description: "preview | draft | final"
        default: final
      format:
        description: "short | long"
        default: short

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub-hosted jobs stop at 6 h
    env:
      ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
      WIKIPEDIA_USER_AGENT: ${{ vars.WIKIPEDIA_USER_AGENT }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PUBLISHING_ENABLED: ${{ vars.YOUTUBE_PUBLISHING_ENABLED || 'false' }}
      MEDIA_ROOT: ${{ github.workspace }}/media
      BLENDER_BINARY: /opt/blender/blender-4.5.15-linux-x64/blender
      PIPER_VOICE_MODEL: ${{ github.workspace }}/models/voices/es_ES-davefx-medium.onnx
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Qué Pasaría Si' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter fonts-dejavu-core
      - name: Cache Blender and voice
        uses: actions/cache@v4
        with:
          path: |
            /opt/blender
            models/voices
          key: tools-blender-4.5.15-piper-davefx-v1
      - name: Install Blender and voice
        run: |
          if [ ! -x "$BLENDER_BINARY" ]; then sudo mkdir -p /opt/blender && sudo chown "$USER" /opt/blender && scripts/install_blender.sh /opt/blender; fi
          if [ ! -f "$PIPER_VOICE_MODEL" ]; then scripts/install_voice.sh; fi
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python scripts/autopilot.py preflight
      - name: Autopilot
        run: |
          CMD="${{ github.event.inputs.command || 'run' }}"
          if [ "$CMD" = "run" ]; then
            python scripts/autopilot.py run --channel "$CHANNEL_NAME" \
              --format "${{ github.event.inputs.format || 'short' }}" --mode "${{ github.event.inputs.mode || 'final' }}"
          else
            python scripts/autopilot.py "$CMD" ${{ github.event.inputs.run_id }}
          fi
      - name: Keep the video, thumbnails and QA sheet for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-${{ github.run_id }}
          path: |
            media/autopilot/*/*.mp4
            media/autopilot/*/*_frames.png
            media/autopilot/*/*.report.json
            media/autopilot/*/thumbnails/*.jpg
          retention-days: 14
          if-no-files-found: ignore
